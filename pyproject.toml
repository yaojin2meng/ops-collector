[project]
name = "ops-collector"
version = "0.1.0"
description = "多站点 new-api / sub2api 运营数据采集器（调用日志、分组倍率、成功率、首字、tk/s）——无 Web UI，供运营 agent 调用"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25",
    "cryptography>=43",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "jsonschema>=4.21"]

[project.scripts]
ops-collector = "ops_collector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
